# OPTIONAL fallback -- normally NOT needed.
#
# `docker-compose.yml` already makes the host's /dev/video* devices available
# (a read-only /dev bind plus a device-cgroup rule for major 81), so a plain
#   docker compose up -d --build
# is enough, with or without a camera attached.
#
# Use this file only if that default does not work on your machine (for
# example some rootless-Docker setups ignore device-cgroup rules). It pins ONE
# device explicitly, which makes `up` fail when that device does not exist:
#
#   docker compose -f docker-compose.yml -f docker-compose.camera.yml up --build -d
#
# If your camera isn't /dev/video0, check with `ls /dev/video*` on the host
# and update BOTH the line below and CAMERA_INDEX.
services:
  gym-face-checkin:
    devices:
      - "/dev/video0:/dev/video0"
    # دسترسی به دستگاه‌های ویدیو حتی وقتی داکر بدون روت (rootless) اجرا می‌شود
    group_add:
      - video
