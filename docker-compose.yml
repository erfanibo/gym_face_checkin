services:
  gym-face-checkin:
    build: .
    container_name: gym_face_checkin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      # فقط اگر دوربین با تنظیم پیش‌فرض تصویر نمی‌دهد (مثلاً CAMERA_FOURCC=MJPG)
      - CAMERA_FOURCC=${CAMERA_FOURCC:-}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-0}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-0}
      # موتور تشخیص چهره: DeepFace (پیش‌فرض). مدل و آشکارساز را بعد از اجرای scripts/benchmark_deepface.py
      # روی همین PC انتخاب کنید؛ با تغییر مدل، image را با همان مقدار دوباره build کنید (README).
      - RECOGNIZER_BACKEND=${RECOGNIZER_BACKEND:-deepface}
      - DEEPFACE_MODEL=${DEEPFACE_MODEL:-SFace}
      - DEEPFACE_DETECTOR=${DEEPFACE_DETECTOR:-yunet}
      # آستانه‌ها: خالی = پیش‌فرض خودِ مدل (فقط بعد از تست با افراد واقعی مقدار بدهید)
      - KNOWN_USER_TOLERANCE=${KNOWN_USER_TOLERANCE:-}
      - PENDING_DEDUP_TOLERANCE=${PENDING_DEDUP_TOLERANCE:-}
      - REGISTRATION_DUPLICATE_FACE_TOLERANCE=${REGISTRATION_DUPLICATE_FACE_TOLERANCE:-}
      - DEEPFACE_MIN_FACE_CONFIDENCE=${DEEPFACE_MIN_FACE_CONFIDENCE:-0.85}
      - DEEPFACE_MIN_FACE_PIXELS=${DEEPFACE_MIN_FACE_PIXELS:-60}
      - DEEPFACE_MAX_FRAME_SIDE=${DEEPFACE_MAX_FRAME_SIDE:-960}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # بررسی نسخه‌ی جدید (تنظیمات > به‌روزرسانی سیستم). «owner/repo» ریپوی خودتان اگر فورک کرده‌اید؛
      # مقدار خالی (UPDATE_CHECK_REPO=) بررسی را غیرفعال می‌کند. نکته: «-» (نه «:-») تا مقدار خالی هم معتبر بماند.
      - UPDATE_CHECK_REPO=${UPDATE_CHECK_REPO-erfanibo/gym_face_checkin}
      # Fixed session-signing key -- REQUIRED so logins survive a container
      # restart/rebuild. Generate once with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      # and put the result in a .env file next to this compose file.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set in .env}
      # Only used the very first time the app runs (before any password
      # exists in the database). Change it from the Settings tab after
      # first login, then this value stops mattering.
      - MANAGER_INITIAL_PASSWORD=${MANAGER_INITIAL_PASSWORD:-changeme}
    volumes:
      - ./data:/app/data
      # دوربین: پوشه‌ی /dev میزبان (فقط‌خواندنی) دیده می‌شود، ولی طبق قانون پایین فقط دستگاه‌های ویدیو
      # (شماره‌ی اصلی ۸۱، یعنی /dev/video*) اجازه‌ی دسترسی دارند. بدون دوربین هم سرویس بدون خطا بالا
      # می‌آید و اتصال یا جابه‌جایی دوربین بعد از بالا آمدن سرویس هم شناسایی می‌شود.
      # (نگاشت ثابت `devices: /dev/video0` عمداً استفاده نشده: بدون دوربین، اجرای compose با خطا متوقف می‌شود.)
      - /dev:/dev:ro
    device_cgroup_rules:
      - "c 81:* rmw"
    # دسترسی به دستگاه‌های ویدیو حتی وقتی داکر بدون روت (rootless) اجرا می‌شود
    group_add:
      - video
