services:
  gym-face-checkin:
    build: .
    container_name: gym_face_checkin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      # فقط اگر دوربین با تنظیم پیش‌فرض تصویر نمی‌دهد (مثلاً CAMERA_FOURCC=MJPG)
      - CAMERA_FOURCC=${CAMERA_FOURCC:-}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-0}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-0}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # بررسی نسخه‌ی جدید (تنظیمات > به‌روزرسانی سیستم). «owner/repo» ریپوی خودتان اگر فورک کرده‌اید؛
      # مقدار خالی (UPDATE_CHECK_REPO=) بررسی را غیرفعال می‌کند. نکته: «-» (نه «:-») تا مقدار خالی هم معتبر بماند.
      - UPDATE_CHECK_REPO=${UPDATE_CHECK_REPO-erfanibo/gym_face_checkin}
      # Fixed session-signing key -- REQUIRED so logins survive a container
      # restart/rebuild. Generate once with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      # and put the result in a .env file next to this compose file.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set in .env}
      # Only used the very first time the app runs (before any password
      # exists in the database). Change it from the Settings tab after
      # first login, then this value stops mattering.
      - MANAGER_INITIAL_PASSWORD=${MANAGER_INITIAL_PASSWORD:-changeme}
    volumes:
      - ./data:/app/data
    # NOTE: no `devices:` camera passthrough here on purpose -- see
    # docker-compose.camera.yml. This base file always starts, with or
    # without a webcam attached to the host (the app itself handles a
    # missing/disconnected camera gracefully too, see app/face_engine.py);
    # add the camera override only on the machine that actually sits next
    # to the door camera.
