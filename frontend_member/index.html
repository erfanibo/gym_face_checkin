<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل کاربری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161c;
    --panel: #1a2029;
    --panel-2: #212936;
    --line: #2b3444;
    --text: #e7ebf1;
    --muted: #8b95a7;
    --accent: #3ddc97;
    --danger: #e05656;
    --warn: #f0b43c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; min-height: 100vh; display: flex; flex-direction: column; }

  /* login */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; padding: 32px 24px; display: flex; flex-direction: column; gap: 14px;
  }
  .login-card h1 { font-size: 19px; margin: 0 0 6px; text-align: center; }
  /* سربرگ: «نام باشگاه | پنل کاربری» */
  .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; line-height: 1.7; }
  .login-card .brand { justify-content: center; }
  .brand .brand-sep { color: var(--muted); font-weight: 400; }
  .brand .brand-sub { color: var(--muted); font-weight: 500; font-size: .86em; }
  .brand.no-club .brand-club, .brand.no-club .brand-sep { display: none; }
  .brand.no-club .brand-sub { color: var(--text); font-size: 1em; font-weight: 700; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 13px 14px;
    font-family: inherit; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 4px; }
  .error-msg { color: var(--danger); font-size: 13px; min-height: 16px; }
  .btn-primary {
    background: var(--accent); color: #08140f; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary:active { opacity: 0.85; }

  /* plan view */
  .app-header { margin-bottom: 18px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .app-header h1 { margin: 0; }
  .app-header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .app-header .brand { font-size: 17px; font-weight: 700; }
  .logout-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 9px 13px; font-size: 12px; font-family: inherit; cursor: pointer; flex-shrink: 0;
  }

  .exercise-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px;
    transition: opacity .15s ease;
  }
  .exercise-card.done { opacity: 0.55; }
  .exercise-check {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
    font-size: 15px; color: var(--accent); background: transparent; margin-top: 1px; font-family: inherit;
  }
  .exercise-check.checked { background: var(--accent); color: #08140f; }
  .exercise-name { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .exercise-name.strike { text-decoration: line-through; }
  .exercise-meta { color: var(--muted); font-size: 13px; }
  .exercise-notes { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .empty-plan { text-align: center; color: var(--muted); padding: 50px 20px; line-height: 2; }

  /* login extras */
  label .opt { color: var(--muted); font-weight: 400; opacity: .8; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-inline-end: 64px; }
  .pw-toggle {
    position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--muted); font-family: inherit;
    font-size: 12px; padding: 8px 10px; cursor: pointer; border-radius: 7px;
  }
  .pw-toggle:hover { color: var(--text); }
  input[dir="ltr"] { text-align: right; }
  input[dir="ltr"]::placeholder { text-align: right; }
  .btn-primary:disabled { opacity: .55; cursor: default; }

  /* header actions */
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .logout-btn:hover { color: var(--text); border-color: var(--muted); }

  /* security notice */
  .notice {
    display: flex; align-items: center; gap: 10px;
    background: rgba(240, 180, 60, .10); border: 1px solid rgba(240, 180, 60, .45);
    border-radius: 12px; padding: 9px 10px 9px 8px; margin-bottom: 14px;
  }
  .notice[hidden] { display: none; }
  .notice svg { color: var(--warn); flex-shrink: 0; width: 20px; height: 20px; }
  .notice-text { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
  .notice-text b { font-size: 13px; color: var(--warn); line-height: 1.7; flex: 1 1 150px; }
  .notice-btn {
    background: var(--warn); color: #1c1403; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; flex-shrink: 0;
  }
  .notice-x {
    background: transparent; border: none; color: var(--muted); font-size: 22px; line-height: 1;
    cursor: pointer; padding: 0 6px; font-family: inherit; border-radius: 6px; flex-shrink: 0;
  }
  .notice-x:hover { color: var(--text); }

  /* password sheet */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none;
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-bottom: none;
    border-radius: 18px 18px 0 0; width: 100%; max-width: 480px; padding: 22px 20px 28px;
    display: flex; flex-direction: column; gap: 12px; max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 16px; margin: 0; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .sheet-actions .btn-primary { flex: 1; }
  .btn-secondary {
    background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 10px;
    padding: 14px 18px; font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .toast {
    position: fixed; inset-inline: 16px; bottom: 90px; margin: 0 auto; max-width: 440px; z-index: 30;
    background: var(--panel-2); border: 1px solid var(--accent); color: var(--text);
    border-radius: 12px; padding: 13px 16px; font-size: 13px; line-height: 1.8; display: none;
  }
  .toast.show { display: block; }
  @media (min-width: 520px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); } }

  /* sections + bottom navigation */
  #appScreen { padding-bottom: 96px; }
  .view[hidden] { display: none; }
  .view-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 4px 0 14px; }
  .view-title h2 { font-size: 16px; margin: 0; }
  .view-title .sub { color: var(--muted); font-size: 12px; }
  .tabbar {
    position: fixed; bottom: 0; inset-inline: 0; margin: 0 auto; width: 100%; max-width: 480px; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    background: var(--panel); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab {
    background: transparent; border: none; color: var(--muted); font-family: inherit; font-size: 11.5px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 10px; cursor: pointer;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--accent); background: rgba(61, 220, 151, .09); font-weight: 600; }
  .tab:focus-visible, .tile:focus-visible, .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .card-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .big { font-size: 26px; font-weight: 700; line-height: 1.4; }
  .big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-inline-start: 6px; }
  .card-sub { color: var(--muted); font-size: 13px; line-height: 1.9; margin-top: 4px; }
  .card.st-active { border-color: rgba(61, 220, 151, .5); }
  .card.st-active .big { color: var(--accent); }
  .card.st-soon { border-color: rgba(240, 180, 60, .55); }
  .card.st-soon .big { color: var(--warn); }
  .card.st-expired { border-color: rgba(224, 86, 86, .55); }
  .card.st-expired .big { color: var(--danger); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: start;
    color: var(--text); font-family: inherit; cursor: pointer; display: block; width: 100%;
  }
  .tile .big { font-size: 20px; }
  .bar { height: 6px; border-radius: 4px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; width: 0; transition: width .25s ease; }

  .list-row {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .list-row .title { font-size: 14px; font-weight: 600; }
  .list-row .meta { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.8; }
  .list-row .amount { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip { font-size: 11.5px; border-radius: 20px; padding: 3px 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.in { color: var(--accent); border-color: rgba(61, 220, 151, .5); }
  .chip.out { color: var(--warn); border-color: rgba(240, 180, 60, .5); }
  .empty-note { text-align: center; color: var(--muted); padding: 36px 16px; line-height: 2; font-size: 13.5px; }
  .section-gap { height: 6px; }
</style>
</head>
<body>

<div class="screen" id="loginScreen">
  <div class="login-wrap">
    <form class="login-card" id="loginForm" onsubmit="submitLogin(event)" novalidate>
      <h1 class="brand no-club" id="loginBrand"><span class="brand-club" id="loginClubName"></span><span class="brand-sep">|</span><span class="brand-sub">پنل کاربری</span></h1>
      <div class="field">
        <label for="loginPhone">شماره تماس</label>
        <input id="loginPhone" name="username" type="tel" inputmode="tel" dir="ltr" placeholder="09xxxxxxxxx" autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPassword">رمز عبور <span class="opt">(در صورت تعیین رمز)</span></label>
        <div class="pw-wrap">
          <input id="loginPassword" name="password" type="password" dir="ltr" autocomplete="current-password" />
          <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)">نمایش</button>
        </div>
      </div>
      <div class="error-msg" id="loginError" role="alert"></div>
      <button class="btn-primary" id="loginBtn" type="submit">ورود</button>
    </form>
  </div>
</div>

<div class="screen" id="appScreen" style="display:none">
  <div class="app-header">
    <h1 class="brand no-club" id="appBrand"><span class="brand-club" id="appClubName"></span><span class="brand-sep">|</span><span class="brand-sub">پنل کاربری</span></h1>
    <div class="header-row">
      <div>
        <div class="sub" id="memberGreeting"></div>
      </div>
      <div class="header-actions">
        <button class="logout-btn" id="passwordBtn" onclick="openPasswordSheet()">رمز عبور</button>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>
  </div>

  <div class="notice" id="passwordNotice" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <div class="notice-text">
      <b>برای افزایش امنیت، رمز عبور ثبت کنید.</b>
      <button class="notice-btn" onclick="openPasswordSheet()">تعیین رمز</button>
    </div>
    <button class="notice-x" aria-label="بستن هشدار" title="بستن" onclick="dismissNotice()">×</button>
  </div>

  <section class="view" id="view-dashboard" data-view="dashboard">
    <div class="view-title"><h2>داشبورد</h2></div>
    <div class="card" id="dashMembership">
      <div class="card-label">وضعیت عضویت</div>
      <div class="big" id="dashMembershipMain">—</div>
      <div class="card-sub" id="dashMembershipSub"></div>
    </div>
    <div class="tiles">
      <button class="tile" type="button" onclick="showView('workout')">
        <div class="card-label">پیشرفت برنامه تمرینی</div>
        <div class="big" id="dashWorkoutMain">—</div>
        <div class="bar" aria-hidden="true"><i id="dashWorkoutBar"></i></div>
      </button>
      <button class="tile" type="button" onclick="showView('attendance')">
        <div class="card-label">ورود در ۳۰ روز گذشته</div>
        <div class="big" id="dashVisitsMain">—</div>
      </button>
    </div>
    <div class="card">
      <div class="card-label">آخرین ورود به باشگاه</div>
      <div class="card-sub" style="margin:0; color:var(--text)" id="dashLastVisit">—</div>
    </div>
  </section>

  <section class="view" id="view-workout" data-view="workout" hidden>
    <div class="view-title"><h2>برنامه تمرینی</h2><span class="sub" id="updatedNote"></span></div>
    <div id="planList"></div>
  </section>

  <section class="view" id="view-membership" data-view="membership" hidden>
    <div class="view-title"><h2>شهریه و عضویت</h2></div>
    <div class="card" id="memMembership">
      <div class="card-label">وضعیت عضویت</div>
      <div class="big" id="memMembershipMain">—</div>
      <div class="card-sub" id="memMembershipSub"></div>
    </div>
    <div class="view-title" style="margin-top:18px"><h2>سابقه تمدیدها</h2></div>
    <div id="purchaseList"></div>
  </section>

  <section class="view" id="view-attendance" data-view="attendance" hidden>
    <div class="view-title"><h2>سابقه حضور</h2></div>
    <div class="tiles">
      <div class="tile" style="cursor:default"><div class="card-label">ورود در ۳۰ روز گذشته</div><div class="big" id="attVisits">—</div></div>
      <div class="tile" style="cursor:default"><div class="card-label">آخرین ورود</div><div class="card-sub" style="margin:0; color:var(--text)" id="attLast">—</div></div>
    </div>
    <div id="attendanceList"></div>
  </section>

  <nav class="tabbar" aria-label="بخش‌های پنل">
    <button class="tab" type="button" data-tab="dashboard" onclick="showView('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>داشبورد</span></button>
    <button class="tab" type="button" data-tab="workout" onclick="showView('workout')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>برنامه تمرینی</span></button>
    <button class="tab" type="button" data-tab="membership" onclick="showView('membership')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg><span>شهریه</span></button>
    <button class="tab" type="button" data-tab="attendance" onclick="showView('attendance')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>سابقه حضور</span></button>
  </nav>
</div>

<div class="sheet-backdrop" id="passwordSheet" onclick="if(event.target===this) closePasswordSheet()">
  <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" onsubmit="submitPassword(event)" novalidate>
    <h2 id="sheetTitle">تعیین رمز عبور</h2>
    <div class="field" id="sheetCurrentField" style="display:none">
      <label for="sheetCurrent">رمز عبور فعلی</label>
      <input id="sheetCurrent" type="password" dir="ltr" autocomplete="current-password" />
    </div>
    <div class="field">
      <label for="sheetNew">رمز عبور جدید <span class="opt">(حداقل ۶ کاراکتر)</span></label>
      <div class="pw-wrap">
        <input id="sheetNew" type="password" dir="ltr" autocomplete="new-password" />
        <button type="button" class="pw-toggle" onclick="togglePassword('sheetNew', this)">نمایش</button>
      </div>
    </div>
    <div class="field">
      <label for="sheetRepeat">تکرار رمز عبور جدید</label>
      <input id="sheetRepeat" type="password" dir="ltr" autocomplete="new-password" />
    </div>
    <div class="error-msg" id="sheetError" role="alert"></div>
    <div class="sheet-actions">
      <button class="btn-primary" id="sheetSaveBtn" type="submit">ذخیره</button>
      <button class="btn-secondary" type="button" onclick="closePasswordSheet()">انصراف</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const API_BASE = '';

function escapeHtml(value) {
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toFaDigits(value) {
  return String(value).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function timeAgo(iso) {
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (seconds < 60) return `${toFaDigits(seconds)} ثانیه پیش`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${toFaDigits(minutes)} دقیقه پیش`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${toFaDigits(hours)} ساعت پیش`;
  const days = Math.floor(hours / 24);
  return `${toFaDigits(days)} روز پیش`;
}

/* نام باشگاه از «تنظیمات > اطلاعات باشگاه» پنل مدیر می‌آید (مسیر عمومی، قبل از لاگین هم کار می‌کند).
   سربرگ هر دو صفحه: «نام باشگاه | پنل کاربری». */
function applyClubName(name) {
  const clean = (name || '').trim();
  document.title = clean ? `${clean} | پنل کاربری` : 'پنل کاربری';
  document.getElementById('loginClubName').textContent = clean;   // textContent: نام را کاربر وارد کرده
  document.getElementById('appClubName').textContent = clean;
  for (const id of ['loginBrand', 'appBrand']) document.getElementById(id).classList.toggle('no-club', !clean);
}

async function loadPublicClubName() {
  try {
    const res = await fetch(`${API_BASE}/api/public/club`);
    if (res.ok) applyClubName((await res.json()).club_name);
  } catch { /* سرور لحظه‌ای در دسترس نیست -- نام نمایش داده نمی‌شود، بقیه‌ی صفحه عادی کار می‌کند */ }
}

let profile = null;   // { full_name, has_password }

async function checkAuth() {
  const res = await fetch(`${API_BASE}/api/auth/me`);
  const data = await res.json().catch(() => ({ role: null }));
  if (data.role === 'member') {
    showApp();
  } else {
    showLogin();
  }
}

function showLogin(message) {
  stopLiveUpdates();
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('loginError').textContent = message || '';
}

const VIEWS = ['dashboard', 'workout', 'membership', 'attendance'];
const state = { plan: null, membership: null, attendance: null };

async function getJson(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (res.status === 401) { showLogin('نشست شما منقضی شده است. لطفاً دوباره وارد شوید.'); return null; }
  if (!res.ok) return null;
  return res.json();
}

async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  showView(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard', false);
  await Promise.all([loadProfile(), loadPlan(), loadMembership(), loadAttendance()]);
  startLiveUpdates();
}

/* ---- به‌روزرسانی خودکار ----
   اتصال زنده (WebSocket) به‌محض تغییر اطلاعات پیام «بازخوانی» می‌فرستد؛ هیچ اطلاعاتی در پیام نیست و
   داده از مسیرهای معمول /api/me/* دوباره خوانده می‌شود. اگر اتصال زنده برقرار نباشد (مثلاً پشت برخی
   شبکه‌ها)، هر ۳۰ ثانیه و هنگام بازگشت به صفحه، اطلاعات از نو خوانده می‌شود. */
const REFRESHERS = {
  attendance: () => loadAttendance(),
  membership: () => loadMembership(),
  profile:    () => Promise.all([loadProfile(), loadMembership()]),
  workout:    () => loadPlan(),
  all:        () => Promise.all([loadPublicClubName(), loadProfile(), loadPlan(), loadMembership(), loadAttendance()]),
};
const live = { ws: null, retry: 0, reconnectTimer: null, pollTimer: null, pending: new Set(), flushTimer: null, active: false };

function appVisible() { return document.getElementById('appScreen').style.display !== 'none'; }

function queueRefresh(scope) {
  live.pending.add(REFRESHERS[scope] ? scope : 'all');
  if (live.flushTimer) return;
  live.flushTimer = setTimeout(async () => {
    const scopes = live.pending.has('all') ? ['all'] : [...live.pending];
    live.pending.clear(); live.flushTimer = null;
    if (!appVisible() || document.hidden) return;
    try { await Promise.all(scopes.map(sc => REFRESHERS[sc]())); } catch { /* تلاش بعدی خودکار است */ }
  }, 300);
}

function connectLive() {
  if (!live.active || live.ws) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try { ws = new WebSocket(`${proto}://${location.host}/ws/member`); } catch { return; }
  live.ws = ws;
  ws.onopen = () => { live.retry = 0; queueRefresh('all'); };   // رویدادهای ازدست‌رفته را جبران می‌کند
  ws.onmessage = (event) => {
    let msg; try { msg = JSON.parse(event.data); } catch { return; }
    if (msg && msg.event === 'refresh') queueRefresh(msg.scope);
  };
  ws.onerror = () => { try { ws.close(); } catch { /* مهم نیست */ } };
  ws.onclose = (event) => {
    live.ws = null;
    if (!live.active || event.code === 4401 || event.code === 4429) return;
    const delay = Math.min(30000, 2000 * 2 ** Math.min(live.retry++, 4));
    live.reconnectTimer = setTimeout(connectLive, delay);
  };
}

function startLiveUpdates() {
  if (live.active) return;
  live.active = true;
  connectLive();
  live.pollTimer = setInterval(() => { if (!document.hidden && appVisible()) queueRefresh('all'); }, 30000);
}

function stopLiveUpdates() {
  live.active = false;
  clearTimeout(live.reconnectTimer); clearInterval(live.pollTimer); clearTimeout(live.flushTimer);
  live.reconnectTimer = live.pollTimer = live.flushTimer = null;
  live.pending.clear();
  if (live.ws) { const ws = live.ws; live.ws = null; ws.onclose = null; try { ws.close(); } catch { /* مهم نیست */ } }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && appVisible()) queueRefresh('all'); });
window.addEventListener('online', () => { if (appVisible()) { connectLive(); queueRefresh('all'); } });

function showView(name, scroll = true) {
  if (!VIEWS.includes(name)) name = 'dashboard';
  for (const v of VIEWS) document.getElementById(`view-${v}`).hidden = (v !== name);
  for (const tab of document.querySelectorAll('.tab')) {
    if (tab.dataset.tab === name) tab.setAttribute('aria-current', 'page'); else tab.removeAttribute('aria-current');
  }
  try { history.replaceState(null, '', `#${name}`); } catch { /* مهم نیست */ }
  if (scroll) window.scrollTo(0, 0);
}

/* ---- قالب‌بندی (ارقام و تاریخ فارسی) ---- */
const faNum = new Intl.NumberFormat('fa-IR');
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(iso) { return `${fmtDate(iso)} — ${fmtTime(iso)}`; }
function fmtPrice(price) { return price > 0 ? `${faNum.format(price)} تومان` : 'بدون هزینه'; }

function makeEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;   // textContent: نام تعرفه را مدیر وارد کرده
  return el;
}

/* ---- کارت وضعیت عضویت (هم در داشبورد، هم در بخش شهریه) ---- */
const SOON_DAYS = 7;
function renderMembershipCard(cardId, mainId, subId, m) {
  const card = document.getElementById(cardId), main = document.getElementById(mainId), sub = document.getElementById(subId);
  card.classList.remove('st-active', 'st-soon', 'st-expired');
  sub.replaceChildren();
  if (!m) { main.textContent = '—'; sub.textContent = 'اطلاعات عضویت در دسترس نیست. لطفاً دوباره تلاش کنید.'; return; }
  const lines = [];
  if (m.status === 'active') {
    const soon = m.days_left <= SOON_DAYS;
    card.classList.add(soon ? 'st-soon' : 'st-active');
    main.textContent = '';
    main.append(`${faNum.format(m.days_left)}`, makeEl('small', '', 'روز تا پایان عضویت'));
    lines.push(`تاریخ پایان: ${fmtDate(m.membership_expires_at)}`);
    if (soon) lines.push('عضویت شما به‌زودی پایان می‌یابد؛ لطفاً برای تمدید به پذیرش مراجعه کنید.');
  } else if (m.status === 'expired') {
    card.classList.add('st-expired');
    main.textContent = 'منقضی شده';
    lines.push(`عضویت شما در تاریخ ${fmtDate(m.membership_expires_at)} پایان یافته است. لطفاً برای تمدید به پذیرش مراجعه کنید.`);
  } else {
    main.textContent = 'ثبت نشده';
    lines.push('تاریخ پایان عضویت شما هنوز ثبت نشده است.');
  }
  if (m.last_plan_name) lines.push(`آخرین تعرفه: ${m.last_plan_name}`);
  for (const line of lines) sub.append(makeEl('div', '', line));
}

function renderDashboard() {
  renderMembershipCard('dashMembership', 'dashMembershipMain', 'dashMembershipSub', state.membership);

  const items = state.plan ? state.plan.items : null;
  const main = document.getElementById('dashWorkoutMain'), bar = document.getElementById('dashWorkoutBar');
  if (!items) { main.textContent = '—'; bar.style.width = '0'; }
  else if (!items.length) { main.textContent = 'بدون برنامه'; bar.style.width = '0'; }
  else {
    const done = items.filter(i => i.is_done).length;
    main.textContent = '';
    main.append(`${faNum.format(done)}`, makeEl('small', '', `از ${faNum.format(items.length)} حرکت`));
    bar.style.width = `${Math.round(done * 100 / items.length)}%`;
  }

  const a = state.attendance;
  document.getElementById('dashVisitsMain').textContent = a ? `${faNum.format(a.visits_last_30_days)} بار` : '—';
  document.getElementById('dashLastVisit').textContent = a ? (a.last_visit_at ? fmtDateTime(a.last_visit_at) : 'هنوز ورودی ثبت نشده است.') : '—';
}

function renderMembershipView() {
  const m = state.membership;
  renderMembershipCard('memMembership', 'memMembershipMain', 'memMembershipSub', m);
  const list = document.getElementById('purchaseList');
  list.replaceChildren();
  if (!m) return;
  if (!m.purchases.length) { list.append(makeEl('div', 'empty-note', 'هنوز سابقه‌ای برای تمدید عضویت شما ثبت نشده است.')); return; }
  for (const p of m.purchases) {
    const row = makeEl('div', 'list-row');
    const left = makeEl('div');
    left.append(makeEl('div', 'title', p.plan_name));
    left.append(makeEl('div', 'meta', `مدت: ${faNum.format(p.duration_days)} روز`));
    left.append(makeEl('div', 'meta', `از ${fmtDate(p.starts_at)} تا ${fmtDate(p.expires_at)}`));
    row.append(left, makeEl('div', 'amount', fmtPrice(p.price)));
    list.append(row);
  }
}

function renderAttendanceView() {
  const a = state.attendance;
  document.getElementById('attVisits').textContent = a ? `${faNum.format(a.visits_last_30_days)} بار` : '—';
  document.getElementById('attLast').textContent = a ? (a.last_visit_at ? fmtDateTime(a.last_visit_at) : 'ثبت نشده') : '—';
  const list = document.getElementById('attendanceList');
  list.replaceChildren();
  if (!a) return;
  if (!a.events.length) { list.append(makeEl('div', 'empty-note', 'هنوز تردد شما در باشگاه ثبت نشده است.')); return; }
  for (const e of a.events) {
    const isIn = e.event_type === 'in';
    const row = makeEl('div', 'list-row');
    const left = makeEl('div');
    left.append(makeEl('div', 'title', fmtDate(e.checkin_at)));
    left.append(makeEl('div', 'meta', `ساعت ${fmtTime(e.checkin_at)}`));
    row.append(left, makeEl('span', `chip ${isIn ? 'in' : 'out'}`, isIn ? 'ورود' : 'خروج'));
    list.append(row);
  }
}

async function loadMembership() { state.membership = await getJson('/api/me/membership'); renderDashboard(); renderMembershipView(); }
async function loadAttendance() { state.attendance = await getJson('/api/me/attendance'); renderDashboard(); renderAttendanceView(); }

function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'پنهان' : 'نمایش';
}

async function submitLogin(event) {
  if (event) event.preventDefault();
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errorEl.textContent = '';
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!phone) {
    errorEl.textContent = 'لطفاً شماره تماس را وارد کنید.';
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/auth/member/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password: password || null }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const detail = typeof err.detail === 'string' ? err.detail : '';
      if (res.status === 401 && !password) {
        errorEl.textContent = 'شماره تماس یافت نشد. در صورتی که رمز عبور تعیین کرده‌اید، آن را نیز وارد کنید.';
      } else {
        errorEl.textContent = detail || 'ورود انجام نشد. لطفاً دوباره تلاش کنید.';
      }
      return;
    }
    document.getElementById('loginPassword').value = '';
    try { sessionStorage.removeItem('pwNoticeDismissed'); } catch { /* حافظه‌ی مرورگر در دسترس نیست؛ مهم نیست */ }
    showApp();
  } catch {
    errorEl.textContent = 'ارتباط با سرور برقرار نشد. لطفاً اتصال خود به شبکهٔ باشگاه را بررسی کنید.';
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST' });
  try { sessionStorage.removeItem('pwNoticeDismissed'); } catch { /* مهم نیست */ }
  window.location.reload();
}

/* ---- پروفایل، هشدار امنیتی و تعیین رمز ---- */
async function loadProfile() {
  const res = await fetch(`${API_BASE}/api/me/profile`);
  if (res.status === 401) { showLogin('نشست شما منقضی شده است. لطفاً دوباره وارد شوید.'); return; }
  if (!res.ok) return;
  profile = await res.json();
  renderProfile();
}

function noticeDismissed() {
  try { return sessionStorage.getItem('pwNoticeDismissed') === '1'; } catch { return false; }
}

function renderProfile() {
  if (!profile) return;
  document.getElementById('memberGreeting').textContent = `خوش آمدید، ${profile.full_name}`;   // textContent: نام را مدیر وارد کرده
  document.getElementById('passwordBtn').textContent = profile.has_password ? 'تغییر رمز' : 'رمز عبور';
  document.getElementById('passwordNotice').hidden = profile.has_password || noticeDismissed();
}

function dismissNotice() {
  try { sessionStorage.setItem('pwNoticeDismissed', '1'); } catch { /* فقط تا بستن همین صفحه پنهان می‌ماند */ }
  document.getElementById('passwordNotice').hidden = true;
}

let sheetOpener = null;

function openPasswordSheet() {
  if (!profile) return;
  sheetOpener = document.activeElement;
  const hasPw = profile.has_password;
  document.getElementById('sheetTitle').textContent = hasPw ? 'تغییر رمز عبور' : 'تعیین رمز عبور';
  document.getElementById('sheetCurrentField').style.display = hasPw ? 'block' : 'none';
  for (const id of ['sheetCurrent', 'sheetNew', 'sheetRepeat']) document.getElementById(id).value = '';
  document.getElementById('sheetError').textContent = '';
  document.getElementById('passwordSheet').classList.add('open');
  document.getElementById(hasPw ? 'sheetCurrent' : 'sheetNew').focus();
}

function closePasswordSheet() {
  document.getElementById('passwordSheet').classList.remove('open');
  if (sheetOpener && sheetOpener.focus) sheetOpener.focus();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('passwordSheet').classList.contains('open')) closePasswordSheet();
});

let toastTimer = null;
function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

async function submitPassword(event) {
  event.preventDefault();
  const errorEl = document.getElementById('sheetError');
  const btn = document.getElementById('sheetSaveBtn');
  errorEl.textContent = '';
  const current = document.getElementById('sheetCurrent').value;
  const next = document.getElementById('sheetNew').value;
  const repeat = document.getElementById('sheetRepeat').value;

  if (profile.has_password && !current) { errorEl.textContent = 'لطفاً رمز عبور فعلی را وارد کنید.'; return; }
  if (next.length < 6) { errorEl.textContent = 'رمز عبور جدید باید حداقل ۶ کاراکتر باشد.'; return; }
  if (!next.trim()) { errorEl.textContent = 'رمز عبور نمی‌تواند فقط شامل فاصله باشد.'; return; }
  if (next !== repeat) { errorEl.textContent = 'تکرار رمز عبور با رمز عبور جدید مطابقت ندارد.'; return; }

  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/me/password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_password: next, current_password: profile.has_password ? current : null }),
    });
    if (res.status === 401 && !profile.has_password) { closePasswordSheet(); showLogin('نشست شما منقضی شده است. لطفاً دوباره وارد شوید.'); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      errorEl.textContent = typeof err.detail === 'string' ? err.detail
        : (res.status === 422 ? 'رمز عبور جدید باید بین ۶ تا ۱۲۸ کاراکتر باشد.' : 'ذخیرهٔ رمز عبور انجام نشد.');
      return;
    }
    const firstTime = !profile.has_password;
    profile.has_password = true;
    renderProfile();
    closePasswordSheet();
    showToast(firstTime ? 'رمز عبور ذخیره شد. از این پس برای ورود، شماره تماس و رمز عبور را وارد کنید.' : 'رمز عبور با موفقیت تغییر کرد.');
  } catch {
    errorEl.textContent = 'ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید.';
  } finally {
    btn.disabled = false;
  }
}

async function loadPlan() {
  const data = await getJson('/api/me/workout');
  state.plan = data;
  if (!data) return;
  document.getElementById('updatedNote').textContent = data.updated_at ? `آخرین به‌روزرسانی: ${timeAgo(data.updated_at)}` : '';
  renderPlan(data.items);
  renderDashboard();
}

function renderPlan(items) {
  const list = document.getElementById('planList');
  if (!items.length) {
    list.innerHTML = '<div class="empty-plan">هنوز برنامه‌ای برای شما ثبت نشده است.<br>لطفاً با مربی باشگاه هماهنگ کنید.</div>';
    return;
  }
  list.innerHTML = items.map(item => `
    <div class="exercise-card ${item.is_done ? 'done' : ''}">
      <button class="exercise-check ${item.is_done ? 'checked' : ''}" onclick="toggleItem(${item.id})">${item.is_done ? '✓' : ''}</button>
      <div>
        <div class="exercise-name ${item.is_done ? 'strike' : ''}">${escapeHtml(item.exercise_name)}</div>
        <div class="exercise-meta">${toFaDigits(item.sets)} ست × ${escapeHtml(toFaDigits(item.reps))} تکرار</div>
        ${item.notes ? `<div class="exercise-notes">${escapeHtml(item.notes)}</div>` : ''}
      </div>
    </div>
  `).join('');
}

async function toggleItem(itemId) {
  const res = await fetch(`${API_BASE}/api/me/workout/${itemId}/toggle`, { method: 'PATCH' });
  if (res.status === 401) {
    showLogin('نشست شما منقضی شده است. لطفاً دوباره وارد شوید.');
    return;
  }
  if (!res.ok) return;
  await loadPlan();
}

window.addEventListener('hashchange', () => {
  if (document.getElementById('appScreen').style.display !== 'none') showView(location.hash.slice(1), false);
});

loadPublicClubName();
checkAuth();
</script>
