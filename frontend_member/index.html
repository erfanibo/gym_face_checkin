<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>برنامه‌ی تمرینی من | باشگاه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161c;
    --panel: #1a2029;
    --panel-2: #212936;
    --line: #2b3444;
    --text: #e7ebf1;
    --muted: #8b95a7;
    --accent: #3ddc97;
    --danger: #e05656;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; min-height: 100vh; display: flex; flex-direction: column; }

  /* login */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; padding: 32px 24px; display: flex; flex-direction: column; gap: 14px;
  }
  .login-card h1 { font-size: 19px; margin: 0; text-align: center; }
  .login-card h1 span { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 6px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 13px 14px;
    font-family: inherit; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 4px; }
  .error-msg { color: var(--danger); font-size: 13px; min-height: 16px; }
  .btn-primary {
    background: var(--accent); color: #08140f; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary:active { opacity: 0.85; }

  /* plan view */
  .app-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
  .app-header h1 { font-size: 18px; margin: 0; }
  .app-header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .logout-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 9px 13px; font-size: 12px; font-family: inherit; cursor: pointer; flex-shrink: 0;
  }

  .exercise-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px;
    transition: opacity .15s ease;
  }
  .exercise-card.done { opacity: 0.55; }
  .exercise-check {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
    font-size: 15px; color: var(--accent); background: transparent; margin-top: 1px; font-family: inherit;
  }
  .exercise-check.checked { background: var(--accent); color: #08140f; }
  .exercise-name { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .exercise-name.strike { text-decoration: line-through; }
  .exercise-meta { color: var(--muted); font-size: 13px; }
  .exercise-notes { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .empty-plan { text-align: center; color: var(--muted); padding: 70px 20px; line-height: 2; }
</style>
</head>
<body>

<div class="screen" id="loginScreen">
  <div class="login-wrap">
    <div class="login-card">
      <h1>برنامه‌ی تمرینی من <span>ورود با شماره تماس و کد عضویت</span></h1>
      <div class="field">
        <label>شماره تماس</label>
        <input id="loginPhone" type="tel" placeholder="09xxxxxxxxx" autocomplete="tel" />
      </div>
      <div class="field">
        <label>کد عضویت</label>
        <input id="loginCode" type="text" inputmode="numeric" placeholder="روی رسید ثبت‌نامت نوشته شده"
               onkeydown="if(event.key==='Enter') submitLogin()" />
      </div>
      <div class="error-msg" id="loginError"></div>
      <button class="btn-primary" onclick="submitLogin()">ورود</button>
    </div>
  </div>
</div>

<div class="screen" id="appScreen" style="display:none">
  <div class="app-header">
    <div>
      <h1>برنامه‌ی تمرینی من</h1>
      <div class="sub" id="updatedNote"></div>
    </div>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>
  <div id="planList"></div>
</div>

<script>
const API_BASE = '';

function escapeHtml(value) {
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function timeAgo(iso) {
  const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 60) return `${seconds} ثانیه پیش`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes} دقیقه پیش`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} ساعت پیش`;
  const days = Math.floor(hours / 24);
  return `${days} روز پیش`;
}

async function checkAuth() {
  const res = await fetch(`${API_BASE}/api/auth/me`);
  const data = await res.json().catch(() => ({ role: null }));
  if (data.role === 'member') {
    showApp();
  } else {
    showLogin();
  }
}

function showLogin(message) {
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('loginError').textContent = message || '';
}

async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  await loadPlan();
}

async function submitLogin() {
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  const phone = document.getElementById('loginPhone').value.trim();
  const membership_code = document.getElementById('loginCode').value.trim();

  if (!phone || !membership_code) {
    errorEl.textContent = 'شماره تماس و کد عضویت را وارد کنید.';
    return;
  }

  const res = await fetch(`${API_BASE}/api/auth/member/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, membership_code }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    errorEl.textContent = err.detail || 'شماره تماس یا کد عضویت درست نیست.';
    return;
  }
  showApp();
}

async function logout() {
  await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST' });
  window.location.reload();
}

async function loadPlan() {
  const res = await fetch(`${API_BASE}/api/me/workout`);
  if (res.status === 401) {
    showLogin('نشست شما منقضی شده. دوباره وارد شوید.');
    return;
  }
  const data = await res.json();
  document.getElementById('updatedNote').textContent = data.updated_at
    ? `آخرین به‌روزرسانی: ${timeAgo(data.updated_at)}`
    : '';
  renderPlan(data.items);
}

function renderPlan(items) {
  const list = document.getElementById('planList');
  if (!items.length) {
    list.innerHTML = '<div class="empty-plan">هنوز برنامه‌ای برایت ثبت نشده.<br>با مربی‌ات در باشگاه صحبت کن.</div>';
    return;
  }
  list.innerHTML = items.map(item => `
    <div class="exercise-card ${item.is_done ? 'done' : ''}">
      <button class="exercise-check ${item.is_done ? 'checked' : ''}" onclick="toggleItem(${item.id})">${item.is_done ? '✓' : ''}</button>
      <div>
        <div class="exercise-name ${item.is_done ? 'strike' : ''}">${escapeHtml(item.exercise_name)}</div>
        <div class="exercise-meta">${item.sets} ست × ${escapeHtml(item.reps)} تکرار</div>
        ${item.notes ? `<div class="exercise-notes">${escapeHtml(item.notes)}</div>` : ''}
      </div>
    </div>
  `).join('');
}

async function toggleItem(itemId) {
  const res = await fetch(`${API_BASE}/api/me/workout/${itemId}/toggle`, { method: 'PATCH' });
  if (res.status === 401) {
    showLogin('نشست شما منقضی شده. دوباره وارد شوید.');
    return;
  }
  if (!res.ok) return;
  await loadPlan();
}

checkAuth();
</script>
</body>
</html>
